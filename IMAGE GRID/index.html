<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Responsive image grid layout built with HTML and CSS Grid."
    >

    <meta
        name="author"
        content="Precious Adigeb"
    >

    <title>Image Grid Layout | Precious Adigeb</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <h1>Image Grid</h1>
        <p>A responsive CSS Grid image gallery</p>
    </header>

    <main class="gallery">

        <figure class="gallery-item item-1">
            <img
                src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80"
                alt="Foggy beach with a large rock formation"
            >
        </figure>

        <figure class="gallery-item item-2">
            <img
                src="https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=1200&q=80"
                alt="Modern living room with a white couch"
            >
        </figure>

        <figure class="gallery-item item-3">
            <img
                src="https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=1200&q=80"
                alt="Table with plates and bowls of food"
            >
        </figure>

        <figure class="gallery-item item-4">
            <img
                src="https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=1200&q=80"
                alt="Building with a red door and a tree"
            >
        </figure>

        <figure class="gallery-item item-5">
            <img
                src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=1200&q=80"
                alt="White apartment buildings beside a street"
            >
        </figure>

        <figure class="gallery-item item-6">
            <img
                src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1200&q=80"
                alt="Beach viewed from a hill"
            >
        </figure>

    </main>

    <footer>
        <p>&copy; 2026 Precious Adigeb</p>
    </footer>

</body>
</html>
